<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau des Missions — JJK RP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07070d;
  --bg2: #0d0d18;
  --bg3: #13131f;
  --border: rgba(255,255,255,0.06);
  --border-gold: rgba(194,156,82,0.35);
  --text: #ddd8f0;
  --text2: #7a7a9a;
  --gold: #c29c52;
  --gold2: #f0d080;
  --blue: #4a7fff;
  --purple: #8b5cf6;
  --red: #dc2626;
  --green: #16a34a;

  /* Couleurs par Classe */
  --c-classe4: #16a34a;
  --c-classe3: #4a7fff;
  --c-classe2: #c29c52;
  --c-classe1: #dc2626;
  --c-speciale: #8b5cf6;

  --font-title: 'Cinzel', serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  background-image: radial-gradient(circle at 50% 50%, rgba(58, 92, 204, 0.03) 0%, transparent 80%);
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,7,13,0.9);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border-gold);
  padding: 0 2rem;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left { display: flex; align-items: center; gap: 15px; }

/* LOGO IMAGE */
.logo-container {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 8px rgba(74, 127, 255, 0.4));
}

.header-text h1 {
  font-family: var(--font-title);
  font-size: 16px;
  color: var(--gold2);
  letter-spacing: 2px;
  text-transform: uppercase;
}

#admin-btn {
  font-family: var(--font-title);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--border-gold);
  padding: 8px 16px;
  cursor: pointer;
  transition: 0.3s;
}

#admin-btn:hover { background: rgba(194,156,82,0.1); color: #fff; }

/* MISSIONS */
main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

.section-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 2rem;
}

.section-title { font-family: var(--font-title); letter-spacing: 4px; text-transform: uppercase; font-size: 12px; color: var(--text2); }
.divider { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-gold), transparent); }

.missions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 20px;
}

.mission-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-top: 3px solid var(--card-color, var(--gold));
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  transition: 0.3s;
}

.mission-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

/* Classes Style */
.diff-Classe-4 { --card-color: var(--c-classe4); }
.diff-Classe-3 { --card-color: var(--c-classe3); }
.diff-Classe-2 { --card-color: var(--c-classe2); }
.diff-Classe-1 { --card-color: var(--c-classe1); }
.diff-Spéciale { --card-color: var(--c-speciale); }

.card-content { padding: 1.5rem; flex: 1; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
.mission-title { font-family: var(--font-title); font-size: 15px; color: #fff; }

.badge {
  font-family: var(--font-title);
  font-size: 9px;
  padding: 4px 10px;
  border: 1px solid var(--card-color);
  color: var(--card-color);
  text-transform: uppercase;
}

.slots-section { margin-top: 15px; }
.slot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: rgba(255,255,255,0.03);
  margin-bottom: 5px;
  font-size: 13px;
  border: 1px solid var(--border);
}

.slot-role { font-size: 9px; text-transform: uppercase; font-weight: bold; padding: 2px 6px; border-radius: 2px; }
.role-prof { background: rgba(194,156,82,0.2); color: var(--gold); }
.role-eleve { background: rgba(74,127,255,0.2); color: var(--blue); }

.card-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); }

.btn-inscrire {
  width: 100%;
  font-family: var(--font-title);
  background: transparent;
  border: 1px solid var(--blue);
  color: var(--blue);
  padding: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.btn-inscrire:hover { background: var(--blue); color: #fff; }

/* MODALS & PANELS */
#admin-panel { display: none; background: var(--bg2); padding: 2rem; border-bottom: 1px solid var(--border-gold); }
#admin-panel.open { display: block; }
.admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(5px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border-gold); padding: 2rem; width: 400px; text-align: center; }

input, textarea, select {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: #fff;
  padding: 10px;
  margin-bottom: 10px;
  outline: none;
}

.toast {
  position: fixed; bottom: 20px; right: 20px; padding: 15px 25px;
  background: var(--bg2); border: 1px solid var(--gold); transform: translateY(100px);
  transition: 0.3s; opacity: 0; z-index: 2000;
}
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-container">
      <img src="https://kabhmfkzcxqommwqwtr.supabase.co/storage/v1/object/public/missions/image_59151d.jpg" alt="Logo JJK" class="logo-img">
    </div>
    <div class="header-text">
      <h1>Tableau des Missions</h1>
      <span>Secteur d'Exorcisme</span>
    </div>
  </div>
  <button id="admin-btn" onclick="openPwd()">Accès Admin</button>
</header>

<div id="admin-panel">
  <h3 style="font-family: var(--font-title); color: var(--gold); margin-bottom: 15px;">Éditer le registre</h3>
  <div class="admin-form">
    <input type="text" id="m-titre" placeholder="Titre de la mission" style="grid-column: 1 / -1;"/>
    <textarea id="m-desc" placeholder="Rapport de mission (description)"></textarea>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <select id="m-diff">
        <option value="Classe 4">Classe 4</option>
        <option value="Classe 3">Classe 3</option>
        <option value="Classe 2">Classe 2</option>
        <option value="Classe 1">Classe 1</option>
        <option value="Spéciale">Spéciale</option>
      </select>
      <select id="m-eleves">
        <option value="3">Escouade de 3 élèves</option>
        <option value="4">Escouade de 4 élèves</option>
      </select>
      <button class="btn-inscrire" style="border-color: var(--gold); color: var(--gold);" onclick="createMission()">Publier l'ordre</button>
    </div>
  </div>
</div>

<main>
  <div class="section-header">
    <span class="section-title">Ordres en cours</span>
    <div class="divider"></div>
    <span class="count-badge" id="mission-count">0 mission</span>
  </div>
  <div class="missions-grid" id="missions-grid">
    </div>
</main>

<div class="modal-overlay" id="modal-inscription">
  <div class="modal">
    <h3 style="font-family: var(--font-title); color: var(--gold2); margin-bottom: 20px;">Affectation de l'Exorciste</h3>
    <input type="text" id="insc-pseudo" placeholder="Nom de l'Exorciste" />
    <select id="insc-role">
      <option value="Élève">Élève</option>
      <option value="Professeur">Professeur / Encadrant</option>
    </select>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button onclick="closeModal()" style="flex:1; padding: 10px; background: transparent; color: var(--text2); border: 1px solid var(--border);">Annuler</button>
      <button onclick="confirmerInscription()" style="flex:1; padding: 10px; background: var(--gold); color: #000; border: none; font-weight: bold;">Confirmer</button>
    </div>
  </div>
</div>

<div id="pwd-overlay" class="modal-overlay">
  <div class="modal">
    <h3 style="font-family: var(--font-title); margin-bottom: 15px;">Identification requise</h3>
    <input type="password" id="pwd-input" placeholder="Mot de passe" />
    <button onclick="checkPwd()" style="width:100%; padding: 10px; background: var(--gold); border:none; font-weight:bold;">Entrer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- CONFIG SUPABASE ---
const SUPABASE_URL = 'https://kabhmmfkzcxqommwqwtr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYmhtbWZremN4cW9tbXdxd3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MjgwMTcsImV4cCI6MjA5MjAwNDAxN30.IJ96fGC6g22j3hD_2n1zrQbWNXti8u3SHyv3tYvYYe0';
const ADMIN_PWD = 'jjk2025';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let missions = [];
let inscriptions = [];
let currentMissionId = null;
let isAdmin = false;

async function loadData() {
  const [{ data: m }, { data: i }] = await Promise.all([
    db.from('missions').select('*').order('created_at', { ascending: false }),
    db.from('inscriptions').select('*')
  ]);
  missions = m || [];
  inscriptions = i || [];
  renderMissions();
}

function renderMissions() {
  const grid = document.getElementById('missions-grid');
  document.getElementById('mission-count').textContent = missions.length + ' ordre(s)';

  grid.innerHTML = missions.map(m => {
    const insc = inscriptions.filter(i => i.mission_id === m.id);
    const prof = insc.find(i => i.role === 'Professeur');
    const eleves = insc.filter(i => i.role === 'Élève');
    const maxTotal = 1 + parseInt(m.max_eleves);
    const isFull = insc.length >= maxTotal;
    
    // Nettoyage de la classe pour le CSS
    const classKey = m.difficulte.replace(/\s/g, '-');

    let slots = `<div class="slot"><span class="slot-role role-prof">Prof</span> <span class="${prof ? '' : 'slot-empty'}">${prof ? prof.pseudo : 'Poste vacant'}</span></div>`;
    for(let j=0; j<m.max_eleves; j++) {
      slots += `<div class="slot"><span class="slot-role role-eleve">Élève</span> <span class="${eleves[j] ? '' : 'slot-empty'}">${eleves[j] ? eleves[j].pseudo : 'Poste vacant'}</span></div>`;
    }

    return `
      <div class="mission-card diff-${classKey}">
        <div class="card-content">
          <div class="card-top">
            <span class="mission-title">${m.titre}</span>
            <span class="badge">${m.difficulte}</span>
          </div>
          <p style="font-size: 12px; color: var(--text2); margin-bottom: 15px; font-style: italic;">${m.description || 'Aucun détail supplémentaire.'}</p>
          <div class="slots-section">
            <div style="font-size: 10px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px;">Effectif : ${insc.length}/${maxTotal}</div>
            ${slots}
          </div>
        </div>
        <div class="card-footer">
          ${isFull ? '<div style="color: var(--green); text-align: center; font-size: 12px; font-weight: bold;">Escouade déployée ✓</div>' : 
          `<button class="btn-inscrire" onclick="ouvrirInscription('${m.id}')">Se porter volontaire</button>`}
          ${isAdmin ? `<button onclick="deleteMission('${m.id}')" style="background:none; border:none; color:var(--red); font-size:10px; width:100%; margin-top:10px; cursor:pointer;">Supprimer l'ordre</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// --- FONCTIONS ACTIONS ---
function ouvrirInscription(id) { currentMissionId = id; document.getElementById('modal-inscription').classList.add('open'); }
function closeModal() { document.getElementById('modal-inscription').classList.remove('open'); }

async function confirmerInscription() {
  const pseudo = document.getElementById('insc-pseudo').value.trim();
  const role = document.getElementById('insc-role').value;
  if(!pseudo) return showToast("Nom requis", "error");
  
  const { error } = await db.from('inscriptions').insert({ mission_id: currentMissionId, pseudo, role });
  if(error) showToast("Erreur d'inscription", "error");
  else { showToast("Inscription réussie"); closeModal(); loadData(); }
}

async function createMission() {
  const titre = document.getElementById('m-titre').value;
  const description = document.getElementById('m-desc').value;
  const difficulte = document.getElementById('m-diff').value;
  const max_eleves = document.getElementById('m-eleves').value;

  const { error } = await db.from('missions').insert({ titre, description, difficulte, max_eleves });
  if(error) showToast("Erreur création", "error");
  else { showToast("Mission publiée"); loadData(); }
}

async function deleteMission(id) {
  if(!confirm("Supprimer cet ordre ?")) return;
  await db.from('inscriptions').delete().eq('mission_id', id);
  await db.from('missions').delete().eq('id', id);
  loadData();
}

function openPwd() { document.getElementById('pwd-overlay').classList.add('open'); }
function checkPwd() {
  if(document.getElementById('pwd-input').value === ADMIN_PWD) {
    isAdmin = true;
    document.getElementById('pwd-overlay').classList.remove('open');
    document.getElementById('admin-panel').classList.add('open');
    document.getElementById('admin-btn').textContent = "Accès Autorisé";
    renderMissions();
  } else showToast("Identifiant invalide", "error");
}

function showToast(m, type="success") {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = "toast show";
  setTimeout(() => t.className = "toast", 3000);
}

loadData();
</script>
</body>
</html>
